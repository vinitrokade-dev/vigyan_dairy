<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigyan Dairy Products - Owner Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="admin-brand">
    <img src="/vigyan-dairy-logo.png" alt="Vigyan Dairy Products">
    <h1>Owner Panel</h1>
  </div>
  <div class="right">
    <button class="bell" id="bell" title="Mark all as seen">🔔<span class="count hidden" id="badge">0</span></button>
    <button class="btn ghost small" onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div class="admin-tabs">
    <button id="tOrders" class="active">Orders</button>
    <button id="tProducts">Products</button>
  </div>

  <div id="pOrders">
    <div class="row" style="margin-bottom:14px">
      <div style="max-width:220px">
        <select id="filter">
          <option value="">All orders</option>
          <option>Pending</option>
          <option>Accepted</option>
          <option>Delivered</option>
          <option>Cancelled</option>
        </select>
      </div>
    </div>
    <div id="orders"></div>
  </div>

  <div id="pProducts" class="hidden">
    <div class="card" style="margin-bottom:16px">
      <h2>Add product</h2>
      <form id="addForm" class="row">
        <div><label>Name</label><input id="pname" required></div>
        <div><label>Unit (Kg, Litre...)</label><input id="punit" value="Kg"></div>
        <div style="max-width:90px"><label>Emoji</label><input id="pemoji" value="🥛"></div>
        <div style="flex:0"><button class="btn" type="submit">Add</button></div>
      </form>
    </div>
    <div class="card plist" id="plist"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  requireRole('admin');

  const $ = id => document.getElementById(id);
  let orders = [];

  // ----- Tabs -----
  function showTab(tab) {
    $('pOrders').classList.toggle('hidden', tab !== 'orders');
    $('pProducts').classList.toggle('hidden', tab !== 'products');
    $('tOrders').classList.toggle('active', tab === 'orders');
    $('tProducts').classList.toggle('active', tab === 'products');

    if (tab === 'products') loadProducts();
  }

  $('tOrders').onclick = () => showTab('orders');
  $('tProducts').onclick = () => showTab('products');

  // ----- Orders -----
  async function loadOrders() {
    try {
      orders = await api('/admin/orders');
      renderOrders();
    } catch (err) {
      toast(err.message, true);
    }
  }

  function renderOrders() {
    const filter = $('filter').value;
    const list = orders.filter(order => !filter || order.status === filter);
    const unseen = orders.filter(order => !order.seen).length;

    $('badge').textContent = unseen;
    $('badge').classList.toggle('hidden', !unseen);
    document.title = (unseen ? `(${unseen}) ` : '') + 'Owner Panel';

    $('orders').innerHTML = list.map(order => `
      <div class="card order ${order.seen ? '' : 'new'}">
        <div class="head">
          <div>
            <strong>Order #${order.id}</strong>
            ${order.seen ? '' : '<span class="new-tag">NEW</span>'}
          </div>
          <span class="badge ${order.status}">${order.status}</span>
        </div>

        <div class="meta">
          ${esc(order.customer)} · ${esc(order.phone || 'no phone')} · ${fmtDate(order.created_at)}
        </div>

        <div class="meta">📍 ${esc(order.address || 'no address given')}</div>

        <ul>
          ${order.items.map(item => `
            <li>${esc(item.emoji)} ${esc(item.name)} × ${item.quantity} ${esc(item.unit)}</li>
          `).join('')}
        </ul>

        ${order.note ? `<div class="note">${esc(order.note)}</div>` : ''}

        <div class="actions">
          ${order.status === 'Pending'
            ? `<button class="btn small" onclick="setStatus(${order.id},'Accepted')">Accept</button>`
            : ''}

          ${order.status === 'Accepted'
            ? `<button class="btn small" onclick="setStatus(${order.id},'Delivered')">Mark delivered</button>`
            : ''}

          ${['Pending', 'Accepted'].includes(order.status)
            ? `<button class="btn small danger" onclick="setStatus(${order.id},'Cancelled')">Cancel</button>`
            : ''}
        </div>
      </div>
    `).join('') || '<div class="empty">No orders to show.</div>';
  }

  async function setStatus(id, status) {
    try {
      await api('/admin/orders/' + id, {
        method: 'PATCH',
        body: { status }
      });
      await loadOrders();
    } catch (err) {
      toast(err.message, true);
    }
  }

  $('filter').onchange = renderOrders;

  $('bell').onclick = async () => {
    try {
      await api('/admin/orders/seen', { method: 'POST' });
      await loadOrders();
    } catch (err) {
      toast(err.message, true);
    }
  };

  // ----- Products -----
  async function loadProducts() {
    try {
      const products = await api('/products');

      $('plist').innerHTML = products.map(product => `
        <div class="item">
          <div>
            ${esc(product.emoji)}
            <strong>${esc(product.name)}</strong>
            <span class="meta">per ${esc(product.unit)}</span>
            ${product.available ? '' : '<span class="badge Cancelled">Hidden</span>'}
          </div>

          <div>
            <button
              class="btn ghost small"
              onclick="toggleP(${product.id},${product.available ? 0 : 1})">
              ${product.available ? 'Hide' : 'Show'}
            </button>

            <button class="btn danger small" onclick="delP(${product.id})">
              Delete
            </button>
          </div>
        </div>
      `).join('') || '<div class="empty">No products available.</div>';

    } catch (err) {
      toast(err.message || 'Could not load products', true);
    }
  }

  async function toggleP(id, available) {
    try {
      await api('/admin/products/' + id, {
        method: 'PATCH',
        body: { available }
      });

      await loadProducts();
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function delP(id) {
    const confirmed = confirm(
      'Permanently delete this product from the product list? Existing order history will be preserved.'
    );

    if (!confirmed) return;

    try {
      const result = await api('/admin/products/' + id, {
        method: 'DELETE'
      });

      toast(result.message || 'Product permanently deleted');
      await loadProducts();

    } catch (err) {
      toast(err.message, true);
    }
  }

  $('addForm').onsubmit = async event => {
    event.preventDefault();

    try {
      await api('/admin/products', {
        method: 'POST',
        body: {
          name: $('pname').value,
          unit: $('punit').value,
          emoji: $('pemoji').value
        }
      });

      $('pname').value = '';
      await loadProducts();

    } catch (err) {
      toast(err.message, true);
    }
  };

  // ----- Live notifications -----
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.frequency.value = 880;
      gain.gain.value = 0.15;

      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.25);
    } catch {}
  }

  function connectStream() {
    const token = sessionStorage.getItem('token');
    const stream = new EventSource('/api/admin/stream?token=' + token);

    stream.addEventListener('order', event => {
      const order = JSON.parse(event.data);
      const summary = order.items
        .map(item => `${item.name} × ${item.quantity}`)
        .join(', ');

      toast(`New order from ${order.customer}: ${summary}`);
      beep();

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('New dairy order', {
          body: `${order.customer}: ${summary}`
        });
      }

      loadOrders();
    });
  }

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  loadOrders();
  connectStream();
</script>
</body>
</html>
